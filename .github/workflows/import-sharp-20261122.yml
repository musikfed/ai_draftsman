name: Import original-quality AI Draftsman screenshots (temporary)
on:
  push:
    branches:
      - docs/sharper-screen-20261122
    paths:
      - '.github/workflows/import-sharp-20261122.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify original screenshots archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 160 --user-agent "Mozilla/5.0" 'https://at.adobe.com/KE6VeOu2Aygk3XvK' -o /tmp/sharp-screenshots.zip
          ls -lh /tmp/sharp-screenshots.zip
          file /tmp/sharp-screenshots.zip
          unzip -t /tmp/sharp-screenshots.zip
          test "$(unzip -Z -1 /tmp/sharp-screenshots.zip | grep -c '^docs/screenshots/.*20261122.webp$')" -eq 7
          unzip -o /tmp/sharp-screenshots.zip -d .
          for f in docs/screenshots/{quick-generation,draft-catalog,project-workspace,result-cards,results-closer,graph-closer,cards-closer}-20261122.webp; do
            test -s "$f"
            test "$(stat -c%s "$f")" -ge 90000
          done
      - name: Commit authentic high-definition WebP files only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*-20261122.webp
          git diff --cached --quiet && exit 0
          git commit -m "docs: replace blurry WebP with real 2K-quality interface screenshots"
          git push origin HEAD:${GITHUB_REF_NAME}
