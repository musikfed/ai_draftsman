name: AI Draftsman startup smoke check

on:
  push:
    branches:
      - fix/startup-diagnostics-20261122
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only Flask UI dependencies
        run: python -m pip install 'flask>=3.1,<4' 'pillow>=11,<13' 'requests>=2.32,<3' 'psutil>=6,<8' 'huggingface_hub>=0.35,<2'
      - name: Check Python syntax
        run: python -m compileall -q app.py studio tests
      - name: Import app in safe isolated folder and check page
        env:
          DRAFTSMAN_DATA: ${{ runner.temp }}/ai-draftsman-smoke-data
        run: |
          python - <<'PY'
          from app import app
          with app.test_client() as c:
              for route in ["/", "/api/jobs/active", "/api/quick/results"]:
                  result=c.get(route)
                  print(route, result.status_code)
                  assert result.status_code == 200, (route,result.data[:1000])
          PY
      - name: Run unit tests without GPU
        env:
          DRAFTSMAN_DATA: ${{ runner.temp }}/ai-draftsman-smoke-tests
        run: python -m unittest discover -s tests -v
