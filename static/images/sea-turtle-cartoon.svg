<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" role="img" aria-labelledby="turtleTitle turtleDesc">
<title id="turtleTitle">Весёлая морская черепаха плывёт</title>
<desc id="turtleDesc">Авторская морская черепаха с большой улыбающейся головой, выразительными голубыми глазами, коричнево-оранжевым панцирем и широкими движущимися ластами.</desc>
<defs>
  <linearGradient id="green" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#cbe58a"/><stop offset=".45" stop-color="#97bd57"/><stop offset="1" stop-color="#679046"/></linearGradient>
  <linearGradient id="greenFin" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#bddc7b"/><stop offset=".48" stop-color="#91bb57"/><stop offset="1" stop-color="#5d8e47"/></linearGradient>
  <linearGradient id="finUnder" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#a3c96b"/><stop offset=".5" stop-color="#6d9d52"/><stop offset="1" stop-color="#426f42"/></linearGradient>
  <linearGradient id="headLit" x1=".13" y1=".03" x2=".7" y2="1"><stop stop-color="#dbed91"/><stop offset=".44" stop-color="#a6c768"/><stop offset="1" stop-color="#76a44e"/></linearGradient>
  <linearGradient id="shellBrown" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#a56639"/><stop offset=".6" stop-color="#78452f"/><stop offset="1" stop-color="#462e25"/></linearGradient>
  <linearGradient id="shellOrange" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f6bc66"/><stop offset=".42" stop-color="#d8863e"/><stop offset="1" stop-color="#a65728"/></linearGradient>
  <linearGradient id="bellyCream" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#fff1c7"/><stop offset=".4" stop-color="#f9daa0"/><stop offset="1" stop-color="#d9a672"/></linearGradient>
  <radialGradient id="iris" cx=".48" cy=".39" r=".8"><stop stop-color="#65cde7"/><stop offset=".68" stop-color="#218ac3"/><stop offset="1" stop-color="#20527f"/></radialGradient>
  <clipPath id="shellClip"><path d="M169 405 C159 351 192 299 246 274 C318 237 408 252 472 289 C534 321 570 379 552 430 C536 491 480 528 392 539 C300 546 213 515 182 453Z"/></clipPath>
  <clipPath id="leftFinClip"><path d="M555 463 C499 450 466 456 428 466 C334 466 275 479 198 472 C121 456 66 462 40 477 C16 493 36 529 106 559 C200 600 331 591 433 553 C507 532 550 522 570 501 Q582 479 555 463Z"/></clipPath>
