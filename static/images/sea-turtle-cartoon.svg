</defs>
<style>
  .swim-left{transform-box:view-box;transform-origin:534px 486px;animation:strokeLeft 2.7s ease-in-out infinite}
  .swim-right{transform-box:view-box;transform-origin:685px 420px;animation:strokeRight 2.7s ease-in-out infinite}
  .swim-back{transform-box:view-box;transform-origin:252px 490px;animation:strokeBack 3.8s ease-in-out infinite}
  @keyframes strokeLeft{0%,100%{transform:rotate(-3deg)}25%{transform:rotate(8deg)}54%{transform:rotate(0deg)}78%{transform:rotate(-9deg)}}
  @keyframes strokeRight{0%,100%{transform:rotate(5deg)}25%{transform:rotate(-8deg)}54%{transform:rotate(1deg)}78%{transform:rotate(11deg)}}
  @keyframes strokeBack{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
  @media(prefers-reduced-motion:reduce){.swim-left,.swim-right,.swim-back{animation:none!important}}
</style>
